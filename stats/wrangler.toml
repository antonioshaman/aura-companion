name = "companion-stats"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Anonymous global usage counter for Aura Companion.
# Self-hosted instances opt-in to POST /telemetry/heartbeat; the landing page
# and the app read GET /stats/global.
#
# KV namespace holds one key per active instance (30d TTL) plus a cumulative
# total counter. Recreate with: bunx wrangler kv namespace create STATS_KV
[[kv_namespaces]]
binding = "STATS_KV"
id = "23553fab795e45c29bf25e32e5dca178"

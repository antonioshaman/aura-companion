id: ask-user-question-answers-dropped
title: "Answers to multi-question AskUserQuestion prompts reach the agent"
start_commit: 29fdee8cd4253f43bf5d77a267262c4a30a08ce4
prompt: |
  When Claude asks the user a multi-question `AskUserQuestion`, the user picks
  options in the permission banner and submits, but the agent receives every
  question as "(no option selected)" and silently proceeds with defaults.

  The Claude Code SDK expects the tool's `answers` object to be keyed by each
  question's full `question` text. The browser currently sends something else.
  Fix the answer payload so Claude receives the user's selections (including a
  custom "Other" answer), and keep the Codex backend working on the same wire
  format — its adapter maps browser answers back onto Codex's question ids.
expected_files:
  - web/server/codex-adapter.ts
  - web/src/components/PermissionBanner.tsx
expected_tests:
  - web/server/codex-adapter.test.ts
  - web/src/components/PermissionBanner.test.tsx

# AuraBench task mined from PR #157 ("fix(council): re-arm dead fs.watch watchers + implement EC-13 failsafe tick").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: council-watchers-die-silently
title: "Council filesystem watchers recover from errors and missed checkpoints are caught by a periodic failsafe"
start_commit: b385a7c62b27a36170f676f8ef8ece3bc4c9cded
prompt: |
  Council Mode's only live IPC is `fs.watch` on `.council/checkpoints/` and
  `.council/reviews/`. If a watcher errors once mid-uptime it is logged as a
  warning and stays dead until the server restarts: no checkpoint → wake, no
  review fan-out. Separately, the documented EC-13 failsafe (a recurring tick
  that rescans checkpoints for missed wakes) was never implemented.

  1. Add `web/server/resilient-watch.ts` exporting
     `runResilientWatch({ kind, signal, start, logContext?, onDeath?, sleep? })`:
     it keeps calling `start()` until `signal` is aborted. Each unexpected end —
     `start` throwing (`deathKind: "threw"`) or resolving while not aborted
     (`deathKind: "ended"`) — logs one `log.error` with message
     "council watcher died — re-arming" and data
     `{ event: "council.watcher.died", kind, deathKind, error?, ...logContext }`,
     calls `onDeath({ kind: deathKind, … })` (a throwing hook is logged as
     "council watcher onDeath hook threw" and swallowed), waits via the
     injectable `sleep(ms, signal)` and re-arms. Nothing runs if already
     aborted. Also export `abortableSleep(ms, signal)`, which resolves early on
     abort. Use it for the orchestrator's council watchers, and schedule a
     catch-up scan after a death since `fs.watch` never replays missed files.
  2. On orchestrator init, also start a recurring failsafe tick
     (default every 5 minutes, overridable via env within sane bounds) that
     re-runs the existing missed-wake scan as
     `scanForMissedObserverWakes("failsafe")` (the init-time call keeps no
     argument). Keep the interval handle in a private `observerFailsafeTimer`
     (`null` when not armed), arm it via an idempotent `startObserverFailsafe()`,
     and clear it (back to `null`) in `shutdown()`.
expected_files:
  - web/server/resilient-watch.ts
  - web/server/session-orchestrator.ts
expected_tests:

prompt: |
  In the Council Observer panel, fresh findings land at the bottom of the
  findings rail, so users scroll past old findings to see what the observer just
  said. The council store appends each review's findings to the end of the array.

  Render the findings rail (`FindingsLog`) newest-first, i.e. the reverse of
  the append order (do not sort by timestamp — findings from one review share
  the same timestamp). The change is
  display-only: the store's array stays append-ordered, and the screen-reader
  review announcer keeps working as before. Keep the Playground mock consistent
  with the real append order.

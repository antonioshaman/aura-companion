# AuraBench task mined from PR #184 ("fix(server): relaunch surviving-but-deaf sessions after Bun restart (live PID, dead adapter)").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: deaf-session-after-server-restart
title: "Sessions whose backend link died in a server restart relaunch automatically"
start_commit: fb00f7d4d9282e5a9bf395bb841219a32a52c424
prompt: |
  After the Bun server restarts under `KillMode=process`, some Codex and stdio
  Claude sessions look connected but never answer; they only recover when the
  user presses Reconnect. The CLI / app-server process survived the restart (its
  PID is alive) but the backend adapter that talked to it died with the old
  server process, so nothing is actually listening on its pipes.

  The orchestrator's automatic relaunch path (the `session:relaunch-needed`
  handling) treats a live PID as a healthy session and also refuses to relaunch
  a session still in `starting`. Make automatic relaunch recover such "alive but
  deaf" sessions, while still skipping sessions whose process is alive AND whose
  backend adapter is attached.
expected_files:
  - web/server/session-orchestrator.ts
expected_tests:
  - web/server/session-orchestrator.test.ts
failure_modes:
  - "healthy attached sessions get relaunched in a loop"
  - "relaunch loses the resume anchor (fresh session instead of --resume)"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"
rubric:

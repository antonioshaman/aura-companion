id: deaf-session-after-server-restart
title: "Sessions whose backend link died in a server restart relaunch automatically"
start_commit: fb00f7d4d9282e5a9bf395bb841219a32a52c424
prompt: |
  After the Bun server restarts under `KillMode=process`, some Codex and stdio
  Claude sessions whose CLI / app-server process survived the restart look
  connected but never answer. They only recover when the user presses Reconnect,
  even though the server's automatic relaunch (on `session:relaunch-needed`) runs
  for them — including sessions still shown as `starting`.

  Make automatic relaunch recover these sessions without a manual Reconnect.
  Sessions that are genuinely healthy — their process is alive and the server is
  actually talking to it — must not be relaunched.

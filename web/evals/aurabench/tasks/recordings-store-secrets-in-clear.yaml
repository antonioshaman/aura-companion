# AuraBench task mined from PR #28 ("feat(recorder): redact secrets at write, 0600 file mode, record:false opt-out").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: recordings-store-secrets-in-clear
title: "Protocol recordings never store secrets in clear text and are private to the owner"
start_commit: 89d0f318843e6f2c429a5b8b0cc43b4279e43f04
prompt: |
  Raw protocol recordings under `~/.companion/recordings/*.jsonl` store every
  frame verbatim — including API keys, OAuth/Bearer tokens and GitHub PATs that
  pass through environment dumps, headers and tool output — and the files are
  created with default permissions.

  Harden the recorder (`web/server/recorder.ts`):
  - export `REDACTED_PLACEHOLDER` (`"[REDACTED]"`) and a pure `redactRaw(raw)`:
    inert input is returned byte-identical; JSON input is parsed and values
    under sensitive key names (e.g. `OPENAI_API_KEY`, `companion_auth_token`)
    plus secret-shaped substrings anywhere (OpenAI `sk-…`, Anthropic
    `sk-ant-…`, `Bearer …`, GitHub `ghp_`/`gho_`/`github_pat_`) in nested
    objects and arrays are replaced, and the output is always valid JSON;
    non-JSON input falls back to pattern replacement; harmless values (e.g.
    paths) are kept;
  - apply it to every recorded raw frame and to lifecycle event metadata;
  - bump the recording header version to 3 with `redactionApplied: true`
    (readers still accept older versions);
  - create the recordings directory with mode 0700 and files with 0600;
  - add a `record?: boolean` launch option (default true); `record: false`
    disables recording for that session before anything is recorded.
expected_files:
  - web/server/cli-launcher.ts
  - web/server/recorder.ts
expected_tests:
  - web/server/cli-launcher.test.ts
  - web/server/recorder.test.ts
  - web/server/routes/fs-routes.test.ts
failure_modes:
  - "redaction produces invalid JSON lines"
  - "old recordings (v1/v2) can no longer be read"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"
rubric:
  - id: hidden-tests-pass
    description: "The withheld tests from the original PR pass"
    weight: 3
  - id: no-regression
    description: "The zone regression suite stays green"
    weight: 1
  - id: scoped-change
    description: "The change stays within the problem's scope (no unrelated rewrites)"
    weight: 1

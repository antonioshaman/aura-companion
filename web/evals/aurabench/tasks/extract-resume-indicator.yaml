prompt: |
  `MessageFeed.tsx` is a god-module being split up. Extract the resume-history
  banner (the card shown for resumed/forked sessions with a "load history"
  button, plus the progress text shown after loading) into
  `web/src/components/chat/ResumeIndicator.tsx`, exporting `ResumeIndicator`.

  It takes plain props: `canLoadResumeHistory`, `resumeHistoryLoaded`,
  `resumeModeLabel`, `resumeSourceSessionId`, `sdkSessionCwd` (optional),
  `resumeHistoryLoading`, `resumeHistoryError`, `resumeHistoryHasMore`,
  `onLoadResumeHistory`. It renders nothing at all when `canLoadResumeHistory`
  is false; before loading it shows the card exactly as today (mode label,
  source id, the last two path segments of the cwd with the separator omitted
  when there is no cwd, the button with its loading state, and the error with
  `role="alert"`), with the card marked `data-testid="resume-indicator-cta"`;
  after loading it shows today's progress text variants in an element marked
  `data-testid="resume-indicator-progress"`. Move
  any helper it needs along with it, add its variants to the Playground, and do
  not change what users see. This is a pure refactor.
expected_files:
  - web/src/components/MessageFeed.tsx
  - web/src/components/Playground.tsx
  - web/src/components/chat/ResumeIndicator.tsx
expected_tests:

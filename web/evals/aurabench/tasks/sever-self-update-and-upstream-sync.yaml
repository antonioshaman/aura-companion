id: sever-self-update-and-upstream-sync
title: "Companion no longer self-updates or carries upstream-sync tooling, and installs as aura-companion"
start_commit: af23ff6f1edad2d32d931f12b9f194a56016bd55
prompt: |
  This fork no longer tracks the upstream `the-companion` project, but it still
  ships two subsystems that exist only for that coupling:

  - CLI self-update: the update checker, the `/update-check` and `/update` REST
    routes, the update banner/overlay components, the "Updates" section of the
    Settings page, its store slice state and API client calls, and their
    Playground mocks;
  - upstream-sync/branding tooling: the drift-check and apply-branding scripts
    and their package.json scripts and config.

  Remove both subsystems cleanly (no dead routes, UI, store state or scripts
  left behind; the Docker update dialog component may stay, dormant). Also
  rename the installed service from `the-companion` to `aura-companion` in
  `web/server/service.ts` (systemd unit name, the binary looked up with
  `which`, help text); leave the macOS launchd label and the sandbox image name
  as they are. Everything else must keep working.

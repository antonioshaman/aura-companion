golden_task_version: 1
id: drift-detector-blind-on-underscore-cwd
title: "Silent-stdio drift detection works for workspaces whose path contains underscores"
start_commit: 8e3c2068d685a0391ac2c558b51f1414499360ae
prompt: |
  The silent-stdio drift detector auto-heals Claude sessions whose stdio pipe
  silently stopped delivering frames. It works for most workspaces, but sessions
  whose working directory contains an underscore (e.g. `/root/my_shop_bot`) are
  never detected: every tick logs nothing and the session stays wedged until
  someone kills the CLI by hand.

  Find why the detector never sees the Claude CLI's jsonl transcript for those
  sessions and fix it so the path it computes matches where the CLI actually
  writes (`~/.claude/projects/<slug>/<cliSessionId>.jsonl`), including nested,
  underscore-heavy paths.
expected_files:
  - web/server/silent-stdio-drift-detector.ts
expected_tests:

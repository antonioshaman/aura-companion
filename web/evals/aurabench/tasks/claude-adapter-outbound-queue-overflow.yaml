golden_task_version: 1
id: claude-adapter-outbound-queue-overflow
title: "The Claude adapter's outbound queue is bounded and never silently drops a user message"
start_commit: 5cd1278d960bce368984064b06ee28db01b3cc81
prompt: |
  Add `ClaudeAdapter.enqueueOutboundFrame(kind, payload)` (kind `"user"` or
  `"synthetic"`, returns `{ ok: true }` or `{ ok: false, error }`) — the send
  path that server-generated synthetic frames and user messages will share. It
  is a bounded FIFO:

  - enqueueing never sends synchronously: frames are sent after the call
    returns, strictly in admission order, even under
    concurrent producers; the queue holds at most 16 entries;
  - a `synthetic` frame arriving at saturation is refused with
    `{ ok: false, error: "queue-full" }`;
  - a `user` frame arriving at saturation evicts the OLDEST queued synthetic
    frame (which is then never sent) and is admitted;
  - a `user` frame at saturation with no synthetic to evict is refused with
    `{ ok: false, error: "queue-full-no-evictable" }` so the caller can tell the
    user — user messages must never be dropped silently;
  - expose `getOutboundQueueDepth()` and an awaitable
    `drainOutboundQueueForTest()` that resolves once everything queued so far has
    been sent.
expected_files:
  - web/server/claude-adapter.ts
expected_tests:

# AuraBench task mined from PR #99 ("feat(tasks): surface snapshot-freshness hint on TASKS panel").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: task-panel-stale-snapshot-hint
title: "The Tasks panel shows how old its snapshot is and warns when it's stale"
start_commit: bbeb50e60b87b0370b6c774e1bd72f74a175c7b2
prompt: |
  The Tasks panel mirrors the agent's last `TodoWrite`. When the agent stops
  updating its todo list, the panel silently freezes (e.g. stuck at 1/11 after
  the work is done) and users think the UI is broken.

  Show an honest freshness hint instead of inventing progress:
  - the tasks slice records, per session, when the task list last changed in a
    `sessionTasksUpdatedAt: Map<sessionId, epochMs>` — `setTasks`, `addTask` and
    `updateTask` accept an optional trailing `updatedAt` (default now);
  - tasks restored from message history are stamped with the original message's
    timestamp, not the page-load time;
  - the Tasks panel renders `Snapshot · updated <relative time>` in the muted
    text colour (`text-cc-muted`), switching to the warning colour
    (`text-cc-warning`) when older than 5 minutes, kept current by a periodic
    tick; no hint when no timestamp is known.
expected_files:
  - web/src/components/TaskPanel.tsx
  - web/src/store/sessions-slice.ts
  - web/src/store/tasks-slice.ts
  - web/src/ws.ts
expected_tests:
  - web/src/components/TaskPanel.test.tsx
  - web/src/store/tasks-slice.test.ts
  - web/src/ws.test.ts
failure_modes:
  - "the panel auto-reconciles task statuses the agent never reported"
  - "history replay stamps page-load time"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"
rubric:
  - id: hidden-tests-pass
    description: "The withheld tests from the original PR pass"
    weight: 3
  - id: no-regression
    description: "The zone regression suite stays green"
    weight: 1
  - id: scoped-change
    description: "The change stays within the problem's scope (no unrelated rewrites)"
    weight: 1

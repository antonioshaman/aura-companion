# AuraBench task mined from PR #169 ("feat(server): drive Claude CLI over stdio stream-json instead of --sdk-url").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: claude-cli-stdio-transport
title: "Companion can drive current Claude CLIs that reject --sdk-url"
start_commit: b0dc85895eab3eb03a7c96716060fa345baa27f0
prompt: |
  Claude Code >= 2.1.121 rejects `--sdk-url` for hosts outside a compiled-in
  allowlist, so every Claude session dies on spawn: Companion drives the CLI via
  a WebSocket that the CLI dials back through `--sdk-url`. Switch the default
  control channel to the CLI's documented stdio `stream-json` mode while keeping
  the WebSocket path available behind `COMPANION_CLAUDE_TRANSPORT=ws`.

  Introduce a transport seam so the Claude adapter's protocol translation stays
  identical for both channels, in a new module `web/server/cli-transport.ts`:
  - `WebSocketCliTransport(ws)` — `send`/`close` delegate to the socket,
    `isOpen()` iff `readyState === 1`, `bufferedAmount()` from the socket, and
    the socket exposed as `raw`;
  - `StdioCliTransport(sink: StdinSink, sessionId)` — `StdinSink` is
    `{ write(chunk), flush(), end() }`; `send` writes and flushes every frame and
    throws (message containing "closed") once closed; `close()` ends the pipe
    once (idempotent, tolerates `end()` throwing); `markClosed()` closes the
    channel without touching the pipe; `bufferedAmount()` is 0;
  - `createLineAccumulator(onLine)` with `push(chunk)` emitting only complete
    newline-terminated lines (newline included) and `flush()` emitting a
    non-blank unterminated tail;
  - `pumpStdoutLines(stream, onLine, onError?)` — reads a byte stream to EOF,
    decoding UTF-8 correctly across chunk boundaries, emits lines, flushes the
    tail at EOF, and routes stream errors to `onError` (never rejects).

  In the launcher, a stdio Claude spawn runs the CLI with `--print
  --output-format stream-json --input-format stream-json --verbose
  --include-partial-messages` (no `--sdk-url`, no `-p`) and piped stdio. The
  launcher gets a `setStdioCliOpener(opener)` hook returning the session's adapter; without an
  opener the launch fails (session `exited`, exit code 1) instead of spawning.
  Stdout lines go to the adapter's raw-message handler and the session becomes
  connected on output. A stdio Claude process that survives a server restart
  cannot be re-attached (its pipes died with the old server): on restore from
  disk, terminate it with SIGTERM — but only when the live pid is verifiably still
  that session's stdio Claude process (never signal a reused pid) — mark
  the session exited with its pid cleared, keep its `cliSessionId` so the next
  message resumes the conversation, and do not count it as restored.

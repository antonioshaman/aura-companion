# AuraBench task mined from PR #122 ("fix(council): normalize codex finding shape so non-empty reviews parse").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: codex-observer-findings-dropped
title: "Codex observer reviews with findings are no longer dropped"
start_commit: 82d855a051dbae7395a98d30c681d1597242e6ac
prompt: |
  In a claude+codex Council pair, empty Codex observer reviews (spawn acks) parse
  fine, but any review that actually contains findings is dropped by the review
  watcher with `frame_dropped field=findings.severity`. Codex writes findings in
  its own native shape: `{ severity: "critical"|"high"|"medium"|"low", file,
  line, title, detail }`.

  Extend the existing server-side Codex review normalization so these reviews
  parse: map severities critical→STOP, high→WARN, medium→NOTE, low→INFO (the
  canonical tiers pass through, anything unrecognised becomes NOTE rather than
  dropping the review), `file` → `evidence_path`, `line` → `evidence_lines`
  `[line, line]`, and build `claim` from title and detail. Fields a finding
  already carries in the canonical schema must win over the mapped ones.
expected_files:
  - web/server/council-types.ts
expected_tests:
  - web/server/council-types.test.ts
failure_modes:
  - "Claude observer reviews are altered by the normalization"
  - "grounding/validation is weakened so malformed reviews pass"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"
rubric:

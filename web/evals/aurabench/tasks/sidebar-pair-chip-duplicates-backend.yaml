prompt: |
  In the sidebar, a `claude+codex` Council session on the Claude backend renders
  `[CC] [CLAUDE] + [CODEX]` — the CLAUDE chip repeats what the green `CC` backend
  chip already says (same on the Codex backend with CODEX). Only the other
  provider should be shown: `[CC] [CODEX]`, `[CX] [CLAUDE]`; homogeneous pairs on
  their matching backend show no pair chip at all (current behaviour).

  Export a pure helper `pairHalvesAfterBackendCollapse(pairing, backend)` from
  `web/src/components/council/ProviderBadges.tsx` returning the lower-cased
  halves still to render, in orchestrator-then-observer order: the half(s)
  matching the backend are dropped, both halves are kept if neither matches, and
  malformed input gives `[]`. Use it in the sidebar session row so the badge
  (`data-testid="council-session-badge"`) shows only the remaining provider
  without a `+`, and is absent when nothing remains. Top bar and observer panel
  keep the full pairing.

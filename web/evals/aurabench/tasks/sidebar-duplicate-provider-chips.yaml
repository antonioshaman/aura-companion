golden_task_version: 1
id: sidebar-duplicate-provider-chips
title: "The sidebar no longer shows redundant provider chips for same-provider Council pairs"
start_commit: be86831b063da9c0d766aa120e76af92559c41a3
prompt: |
  In the sidebar, a `claude+claude` Council session shows the green Claude
  backend chip and then an extra `CLAUDE + CLAUDE` provider chip pair, which
  adds nothing in a dense row. Users keep reporting it.

  - Export `isHomogeneousPairing(pairing)` from
    `web/src/components/council/ProviderBadges.tsx` (and the council index):
    true when both halves of a pairing string like `"claude+claude"` name the
    same provider, case-insensitively; false for asymmetric or malformed input
    (empty, one half, empty half, more than two parts).
  - In the sidebar session row only, don't render the council provider badge
    (`data-testid="council-session-badge"`) for homogeneous pairs; asymmetric
    pairs keep it. The top bar and observer panel are unchanged, and the unread
    STOP counter is shown regardless of pairing.
  - Long session names are truncated to a couple of characters because the chip
    cluster competes with the name in one horizontal row. Lay the sidebar row out
    in two rows inside the row button: the name on the first row, and a metadata
    row (chip cluster + cwd) beneath it — the chip cluster must no longer be a
    direct child of the button's flex row.
expected_files:
  - web/src/components/SessionItem.tsx
  - web/src/components/council/ProviderBadges.tsx
  - web/src/components/council/index.ts

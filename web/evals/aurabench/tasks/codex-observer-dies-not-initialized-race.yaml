# AuraBench task mined from PR #172 ("fix(codex): retry init thread/start on "Not initialized" race + re-arm spawn checkpoint after observer relaunch").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: codex-observer-dies-not-initialized-race
title: "Codex observers survive the 'Not initialized' handshake race and get their spawn checkpoint after relaunch"
start_commit: 46455ec3c95bb19023bef8b1dd57a93d6b43bd28
prompt: |
  About 1 in 7 Codex observer spawns die a second after launch. The adapter sends
  the `initialized` notification and the `thread/start` request back-to-back;
  sometimes the Codex app-server services the request first and answers JSON-RPC
  error -32600 "Not initialized". Only "Transport closed" is retried today, so
  the adapter marks init as failed for good while the process stays alive.

  1. In the Codex adapter's init sequence, when `thread/start` fails with
     "Not initialized", re-send `initialized` and retry `thread/start` with an
     exponential backoff starting at 100 ms (100, 200, …), with the same retry
     budget as the existing "Transport closed" retry; if it keeps failing, give up with
     an init error as today.

  2. Relaunching the observer half of a Council pair must re-arm the
     spawn-checkpoint readiness poll when that group's spawn checkpoint never
     landed. Track groups whose spawn checkpoint is still outstanding in a private
     `Set<string>` of group ids named `spawnCheckpointPending` on the session
     orchestrator (cleared when the checkpoint is emitted and on group teardown).
     Resolve the relaunched session's group through the session-group
     coordinator's `findBySessionId` (not only the orchestrator's own group map)
     and take the workspace cwd from the launcher's session info. Relaunching the
     orchestrator half, a group that already got its checkpoint,
     or a relaunch that itself failed must not re-arm.
expected_files:
  - web/server/codex-adapter.ts
  - web/server/session-orchestrator.ts
expected_tests:
  - web/server/codex-adapter.test.ts
  - web/server/session-orchestrator.test.ts
failure_modes:
  - "retries are unbounded"
  - "the spawn checkpoint is emitted twice for the same group"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"

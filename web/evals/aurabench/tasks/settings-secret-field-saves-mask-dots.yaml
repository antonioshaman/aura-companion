id: settings-secret-field-saves-mask-dots
title: "Saved credentials in Settings can't be corrupted by the masking dots"
start_commit: 70067e82d51ebbbdc7649fc90174fad8d751ee06
prompt: |
  On the Settings page, the Claude Code OAuth token and OpenAI API key inputs
  show a row of dots when a secret is already configured. Some users (mobile
  webviews, overlays) end up saving a credential like `"••••••••••••••••a"`:
  what they typed, prefixed with the dots.

  Required behaviour when a secret is configured: the input is empty until the
  user types, and whatever they type is exactly what gets saved. The "already
  configured" hint is the placeholder
  `••••••••••••••••  (enter a new token to replace)` for the Claude token and
  `••••••••••••••••  (enter a new key to replace)` for the OpenAI key (keep the
  normal placeholder when nothing is configured).

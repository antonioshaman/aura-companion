# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: archive-council-pair-kills-one-half
title: "Archiving one half of a Council pair archives the whole pair"
start_commit: bd092f0913e8b95356188a21b539ed2a5c52c785
prompt: |
  In the sidebar, archiving a Council session shows an "Archive Council pair?"
  confirmation that promises to stop both halves — but only the clicked half is
  actually archived and killed. The surviving half keeps running (and polling)
  forever. The session-group coordinator already has a tested group archive
  operation (`archiveGroup`) that nothing in production calls.

  Make `SessionOrchestrator.archiveSession` group-aware: when the session
  belongs to a live Council group (`archiveSession` looks it up itself via the
  coordinator's `findBySessionId`), archive the whole group with the
  coordinator's `archiveGroup` called from `archiveSession`, honouring the EC-2 rule (both session ids are marked
  as intentional kills before either kill runs). The shared worktree is cleaned
  up exactly once, and the Linear issue transition happens only for the clicked
  half. Sessions without a group, or whose group is already archived, keep
  today's single-session path.
expected_files:
  - web/server/session-orchestrator.ts
expected_tests:
  - web/server/session-orchestrator.test.ts
failure_modes:
  - "one half is killed before both are marked intentional (triggers auto-relaunch)"
  - "the shared worktree is cleaned up twice"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"

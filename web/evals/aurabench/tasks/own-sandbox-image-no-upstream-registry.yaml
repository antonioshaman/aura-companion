# AuraBench task mined from PR #96 ("chore(container): own sandbox image, drop upstream stangirard registry").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: own-sandbox-image-no-upstream-registry
title: "Sandboxes use Companion's own local image and never contact the upstream registry"
start_commit: 7f688bb3116aff0827582f33a7349e406373a504
prompt: |
  This fork must not depend on the upstream project's container registry, but
  the sandbox/container runtime still defaults to the upstream image
  `the-companion:latest` and resolves a remote pull source under
  `docker.io/stangirard`.

  Make `aura-companion-sandbox:latest` the single default sandbox image, defined
  in one place and used everywhere the old default is hard-coded (server
  orchestration and session creation, sandbox/env/system routes, and the
  frontend's home page, sandbox manager and Docker update dialog). The container
  manager must no longer map the default image to any remote registry (its
  registry lookup returns `null`, and the upstream registry constant goes away);
  the existing image-pull flow stays, and when the default image cannot be
  pulled it falls back to building it locally as it already does; other images
  keep today's behaviour. Remove the upstream registry references from mocks too.
expected_files:
  - web/server/container-manager.ts
  - web/server/image-pull-manager.ts
  - web/server/routes.ts
  - web/server/routes/env-routes.ts
  - web/server/routes/sandbox-routes.ts
  - web/server/routes/system-routes.ts
  - web/server/sandbox-image.ts
  - web/server/session-creation-service.ts
  - web/server/session-orchestrator.ts
  - web/src/components/DockerUpdateDialog.tsx
  - web/src/components/HomePage.tsx
  - web/src/components/Playground.tsx
  - web/src/components/SandboxManager.tsx

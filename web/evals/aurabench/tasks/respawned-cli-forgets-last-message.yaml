# AuraBench task mined from PR #177 ("feat(server): replay last unanswered user_message on adapter respawn").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: respawned-cli-forgets-last-message
title: "After a silent-stdio respawn the user's last unanswered message is replayed"
start_commit: d5c4905ef52b46dd6cd295b46e9e1d6872d0753d
prompt: |
  When the silent-stdio watchdog respawns a Claude CLI with `--resume`, the new
  process loads the history but never answers the user message that was in
  flight when the pipe died; the user has to notice and re-send it.

  Make the Claude adapter recover this: when a fresh CLI comes up (any later
  `system` init frame, whatever caused the respawn, including a plain transport
  close) and the user's last text-only message was never answered, send it again
  once on that init, and tell the browser via the
  existing error-notice channel with a message containing "replaying your last
  message". The unanswered message stays pending across a transport close,
  and a replayed message still counts as unanswered until a `result` arrives, so
  each further respawn without a `result` replays it again (one replay per
  init). A turn that completed with a `result` must not be replayed, and
  messages with images are never replayed.
expected_files:
  - web/server/claude-adapter.ts
expected_tests:
  - web/server/claude-adapter.test.ts
failure_modes:
  - "the message is replayed after a turn that was answered"
  - "replay loops on every init"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"

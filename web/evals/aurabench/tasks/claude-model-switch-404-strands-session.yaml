# AuraBench task mined from PR #116 ("fix(model-switch): auto-revert Claude model when CLI 404s on next turn").
# start_commit = parent of the merge commit; hidden tests fail there and pass on merge.
golden_task_version: 1
id: claude-model-switch-404-strands-session
title: "Switching to a model the subscription can't use reverts instead of stranding the session"
start_commit: 01f144b93b79c61efcbb51aff731c578163ee49c
prompt: |
  The in-session model dropdown lists models from the API-key model list, but
  sessions run on the user's subscription. Switching a Claude session to a model
  the subscription cannot use appears to succeed, then every following turn fails
  with a 404 and the session is stuck on that model.

  Required behaviour:
  - `web/src/store/cli-status-slice.ts` exposes `pendingClaudeModelSwitches`
    (a Map keyed by session id of `{ requestedModel, previousModel }`),
    `setPendingClaudeModelSwitch(sessionId, requestedModel, previousModel)` and
    `clearPendingClaudeModelSwitch(sessionId)` (no-op, same Map instance, when
    absent); an entry is also dropped on session removal and store reset;
  - when the user picks a different Claude model in the model switcher,
    `setPendingClaudeModelSwitch` is called with the session id, the new model
    and the model it replaces;
  - when the next `result` frame for that session carries
    `api_error_status: 404` while a switch is pending, the session goes back to
    the previous model (in the session and sidebar state, and via `set_model` to
    the CLI), the pending switch is cleared, and a system message names both
    models. A successful result just clears the pending switch; a 404 with no
    pending switch does nothing.
expected_files:
  - web/server/session-types.ts
  - web/src/components/ModelSwitcher.tsx
  - web/src/store/cli-status-slice.ts
  - web/src/store/index.ts
  - web/src/store/sessions-slice.ts
  - web/src/ws.ts
expected_tests:
  - web/src/components/ModelSwitcher.test.tsx
  - web/src/store/cli-status-slice.test.ts
  - web/src/ws.test.ts
failure_modes:
  - "Codex model switching behaviour changes"
  - "every 404 triggers a revert even without a pending switch"
  - "hidden tests edited, skipped or weakened to pass"
  - "unrelated behaviour regresses (zone regression suite fails)"
rubric:

[Service]
# Prepend the service user's own install dir so `claude` / `codex` resolve to
# auracomp's self-updating native install instead of root's stale /usr/bin
# symlink. Without this, spawns pinned to Claude Code 2.1.120 while auracomp
# already had 2.1.263, and newer models 400 with claude_code_version_too_old.
Environment="PATH=/home/auracomp/.local/bin:/home/auracomp/.bun/bin:/usr/local/bin:/usr/bin:/bin"

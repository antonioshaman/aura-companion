name: Sync Claude models

# Daily check against Anthropic's /v1/models, with a manual trigger for
# on-demand refresh. Opens (or updates) a PR when the static fallback in
# `web/src/utils/backends.ts` drifts from the upstream model list.
#
# Repo secret `ANTHROPIC_API_KEY` is required — see
# `docs/deploy/sync-claude-models.mdx`.

on:
  schedule:
    # 06:00 UTC daily — picks up new model releases the morning after
    # Anthropic publishes them, before most maintainers are awake.
    - cron: "0 6 * * *"
  workflow_dispatch:

# Minimum perms: write to repo for the auto-bump branch + open PRs.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'antonioshaman' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Run sync script
        working-directory: web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bun scripts/sync-claude-models.ts

      - name: Detect diff
        id: diff
        working-directory: web
        run: |
          if git diff --quiet src/utils/backends.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift detected — backends.ts already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected:"
            git --no-pager diff src/utils/backends.ts
          fi

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/auto-sync-claude-models"
          BASE="main"
          TITLE="chore(models): sync CLAUDE_MODELS from Anthropic /v1/models"

          git config user.name "aura-auto-sync[bot]"
          git config user.email "aura-auto-sync[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add web/src/utils/backends.ts
          git commit -m "$TITLE"
          # force-with-lease so an existing canonical branch is overwritten
          # cleanly when the upstream list shifts again before the PR merges.
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR already open — branch updated in place; PR will reflect new diff automatically."
          else
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "$(cat <<'EOF'
          ## Summary

          Automated bump of `web/src/utils/backends.ts` static fallback to
          match Anthropic's current `/v1/models` listing. The static
          fallback is what end-users see when they have not configured a
          per-install Anthropic API key — keeping it fresh means
          zero-config users get current models on every aura-companion
          release.

          Generated by `.github/workflows/sync-claude-models.yml` via
          `web/scripts/sync-claude-models.ts`.

          ## Review checklist

          - [ ] Diff in `backends.ts` only touches the
                `AUTO-GENERATED:CLAUDE-MODELS-START/END` block.
          - [ ] Model IDs match the [Latest models comparison](https://docs.anthropic.com/en/docs/about-claude/models/overview).
          - [ ] Coverage gate green (no code structure changes — only
                literal values in the static array).

          ## Provenance

          - Generated by AI agent (workflow + bun script).
          - Upstream source: `https://api.anthropic.com/v1/models`.
          - Human review: required before merge.
          EOF
          )"
          fi

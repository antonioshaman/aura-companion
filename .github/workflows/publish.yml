name: Release

# release-please tracks conventional commits on main, opens/maintains a
# release PR, and on merge cuts the GitHub release + tag
# (aura-companion-vX.Y.Z) and bumps web/package.json. That release IS the
# deliverable: this fork deploys by git-pull + bun build on the VPS (see
# docs/deploy/vps-systemd.mdx), NOT via npm or a container registry. There
# is deliberately no npm-publish / Docker-push step here.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

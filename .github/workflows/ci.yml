name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Dead code guard (unused locals/params)
        working-directory: web
        run: bun run deadcode:check

      - name: DRY guard (duplicate code threshold)
        working-directory: web
        run: bun run dry:check

      # Council Eval Harness L1 gate. Scores the checked-in synthetic fixtures
      # (web/evals/__fixtures__/) against the committed baseline
      # (web/evals/ci-baseline.json) with a load-bearing exit code — zero LLM
      # calls, no network, no secrets. A scorer change that drifts from the
      # baseline (or a stale baseline) fails here rather than shipping.
      # Regenerate intentionally with `bun run eval:replay --ci --update-baseline`.
      - name: Eval replay L1 gate (no regression vs baseline)
        working-directory: web
        run: bun run eval:replay --ci

      # Council PRO Economy quality-floor guardrail (spec Story 4). Runs the
      # hermetic guardrail against the checked-in fixture
      # (web/scripts/__fixtures__/council-economy/) with a load-bearing exit code
      # — proves the data-derived tier policy + depth thresholds never tier-down a
      # seat that has produced a P1, never tier-down the fail-closed security/LLM
      # lens, and never let reduced depth cover a P1 size bucket. Zero LLM calls.
      - name: Council economy guardrail (zero P1 regression)
        working-directory: web
        run: bun run guardrail:ci

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Council Plan docs/history/council/handoffs/PLAN-aura-observer-prompt-bundled-fallback.md P1 #1:
      # regenerate the bundled observer-prompt and fail if it drifts from
      # `web/server/observer-prompt-bundled.ts`. Catches edits to the
      # canonical `.council/prompts/observer-system.md` that didn't re-run
      # the build script. Without this gate, the bundled artifact (consumed
      # at runtime as the fresh-workspace fallback) silently diverges from
      # canonical and ships to npm consumers in that state.
      - name: Observer-prompt bundle drift gate
        working-directory: web
        run: |
          bun run build-observer-prompt-bundle
          git diff --exit-code -- server/observer-prompt-bundled.ts

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Codex protocol contract (offline)
        working-directory: web
        run: bun run test:codex-contract

      - name: Run tests
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: platform
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: platform
        run: bun run typecheck

      - name: Run tests
        working-directory: platform
        run: bun run test

      - name: Build
        working-directory: platform
        run: bun run build

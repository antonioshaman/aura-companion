name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: these jobs only read the repo (P7/CI-HARDEN).
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Guards hook pack (packs/guards): pure-stdlib Python, no install step.
      - name: Guards hook pack tests
        run: python3 -m unittest discover -s packs/guards/tests

      - name: Dead code guard (unused locals/params)
        working-directory: web
        run: bun run deadcode:check

      - name: DRY guard (duplicate code threshold)
        working-directory: web
        run: bun run dry:check

      # Council Eval Harness L1 gate. Scores the checked-in synthetic fixtures
      # (web/evals/__fixtures__/) against the committed baseline
      # (web/evals/ci-baseline.json) with a load-bearing exit code — zero LLM
      # calls, no network, no secrets. A scorer change that drifts from the
      # baseline (or a stale baseline) fails here rather than shipping.
      # Regenerate intentionally with `bun run eval:replay --ci --update-baseline`.
      # Dependency advisories (P7/CI-HARDEN). Non-blocking for now: the tree
      # carries known advisories in transitive dev/build deps, so this step
      # surfaces them as a warning without failing the job. Drop
      # `continue-on-error` once the high/critical backlog is cleared.
      - name: Dependency audit (non-blocking)
        working-directory: web
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Eval replay L1 gate (no regression vs baseline)
        working-directory: web
        run: bun run eval:replay --ci

      # Council PRO Economy quality-floor guardrail (spec Story 4). Runs the
      # hermetic guardrail against the checked-in fixture
      # (web/scripts/__fixtures__/council-economy/) with a load-bearing exit code
      # — proves the data-derived tier policy + depth thresholds never tier-down a
      # seat that has produced a P1, never tier-down the fail-closed security/LLM
      # lens, and never let reduced depth cover a P1 size bucket. Zero LLM calls.
      - name: Council economy guardrail (zero P1 regression)
        working-directory: web
        run: bun run guardrail:ci

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Council Plan docs/history/council/handoffs/PLAN-aura-observer-prompt-bundled-fallback.md P1 #1:
      # rebuild the observer prompt (SOUL spliced into observer-system.md) and
      # the bundled fallback, then fail if either committed output differs.
      # Catches an edited `.council/prompts/OBSERVER-SOUL.md` that was not
      # spliced, or an edited `observer-system.md` that was not re-bundled.
      # The same `check-observer-prompt-drift` script runs in the pre-commit
      # hook and in `prepublishOnly`, so the three gates cannot diverge.
      - name: Observer-prompt bundle drift gate
        working-directory: web
        run: bun run check-observer-prompt-drift

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Codex protocol contract (offline)
        working-directory: web
        run: bun run test:codex-contract

      - name: Run tests
        working-directory: web
        run: bun run test

      - name: Build frontend
        working-directory: web
        run: bun run build
        env:
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST || 'https://us.i.posthog.com' }}

  platform:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: platform
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: platform
        run: bun run typecheck

      - name: Run tests
        working-directory: platform
        run: bun run test

      - name: Build
        working-directory: platform
        run: bun run build

  # In-repo council catalog + vendored skills (PLAN-aura-uiux-agent-enrichment
  # Tasks 1-4). verify-catalog.sh is the catalog's own canary gate (P0, C1-C6,
  # C10-C15: inline-panel ban, capability universe, mirrors byte-identical,
  # sha256 lock, symlink/mode defences); it exits non-zero on any violation.
  # The two bun checks are hermetic (no network): vendored-skills re-hashes every
  # pinned file, uiux-sources re-derives every catalog verdict from its facts.
  council-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by commit SHA (v5): this job attests bytes, so its toolchain must not float.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install the one dependency the catalog canaries need
        run: pip install --quiet --require-hashes -r .github/council-canary-requirements.txt

      - name: Council catalog canaries (verify-catalog.sh)
        run: bash packs/skills/_council-experts/.verify/verify-catalog.sh

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Vendored skills match their pinned lock
        working-directory: web
        run: bun scripts/vendored-skills.ts check

      - name: Shipped skills manifest matches the tree (ship gate, ownership hashes)
        working-directory: web
        run: bun scripts/skill-manifest.ts check

      - name: UI/UX source catalog verdicts follow from their facts
        working-directory: web
        run: bun scripts/uiux-sources.ts check

  # The npm tarball and the server image, tested as artifacts
  # (PLAN-aura-uiux-agent-enrichment Task 9). `npm pack` runs prepack, which
  # stages the shipped skill pack into web/packs/skills. The gate fails closed
  # on size (15 MB), licence and the exact shipped set. pack-smoke installs the
  # tarball into a clean HOME and boots the server three times: plain, with a
  # pre-seeded user skill of the same name, and with the toolkit off. bun is
  # pinned here (not latest): these jobs attest an artifact.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: bun run build

      - name: Pack the npm tarball (prepack stages packs/skills)
        working-directory: web
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --json --pack-destination "$RUNNER_TEMP/pack" > "$RUNNER_TEMP/pack/pack.json"

      - name: Package gate (size budget, licence, exact shipped set)
        working-directory: web
        run: bun scripts/skill-pack-build.ts gate "$RUNNER_TEMP/pack/pack.json"

      - name: pack-smoke (clean HOME; plain, pre-seeded user skill, toolkit off)
        working-directory: web
        run: bun scripts/pack-smoke.ts "$RUNNER_TEMP"/pack/aura-companion-*.tgz

  # The server image users pull (Dockerfile): built from the npm tarball with
  # pinned base images and CLI versions, then booted and probed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the server image
        run: docker build -t aura-companion:ci .

      - name: Smoke the image (runtimes, boot, skill pack installed, toolkit view)
        run: bash scripts/docker-smoke.sh aura-companion:ci

  experience-packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: aura-check unit tests
        working-directory: packs/checks
        run: python3 -m unittest discover -s tests -t .

      # Errors (secrets, tracked .env, inline systemd secrets, bad Alembic ids)
      # fail the job; warnings are printed for the reviewer.
      - name: aura-check on this change
        if: github.event_name == 'pull_request'
        run: packs/checks/bin/aura-check --changed --base "origin/${{ github.base_ref }}"

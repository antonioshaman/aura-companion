# _phase2-coverage-tokens.yml — semantic-coverage ground-truth (Phase 2c-N1).
#
# Read by `.verify/c10-coverage.py`, run as C10 from verify-catalog.sh.
#
#   targets.<id>.tokens             — MUST appear ≥1 time across ANY of
#                                     `targets.<id>.search_paths` (OR across
#                                     paths; the paths are mirrors of one doc,
#                                     and C11 separately proves they are
#                                     byte-identical, which is what makes the
#                                     OR safe rather than sloppy).
#   targets.<id>.structural_anchors — MUST appear ≥`min_count` (default 1) in
#                                     EACH listed path (AND across paths).
#   forbidden[].pattern             — MUST appear 0 times in EACH listed path.
#
# Token kinds:
#   - kind: fixed   (default) — plain substring count, no metacharacters
#   - kind: regex             — pattern must match SAFE_REGEX_SHAPE in
#                               c10-coverage.py (literals, escaped dots, `\w+`
#                               placeholders, `|` alternation, `/`, `-`).
#                               Quantifiers outside `\w+` cannot be expressed in
#                               that alphabet, so catastrophic backtracking is
#                               unreachable by construction per Hunt REC-3.
#
# Matching is in-process (str.count / re.findall over the file body), not a
# grep subprocess: there is no shell, no argv, and no timeout to tune.
#
# Every path here is shape-checked against REF_PATH_REGEX and bounded to the
# skills root before it is opened. A data file that names a file to read is an
# instruction to read it, and an unchecked one would be a file-read primitive
# with a hit-count oracle.
#
# Path convention (Phase 2a-N2 ratified, captured in HANDOFF-phase-2b-after-N3):
#   - dahl   B1 → 3 Aura dispatcher mirrors (no catalog-side canonical)
#   - ritchie B1 → 3 Aura dispatcher mirrors (no catalog-side canonical)
#   - hashimoto B2 → 1 catalog-side canonical (mirrors materialised by Phase
#                    2c-N2 build runner; canary intentionally targets canonical
#                    so first-run is green pre-N2 and a `git diff --exit-code`
#                    in N2 enforces byte-identity post-cp).


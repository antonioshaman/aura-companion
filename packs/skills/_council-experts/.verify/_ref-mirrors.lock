# _ref-mirrors.lock — sha256 attestation manifest for Phase 2 ref mirrors.
#
# Read by verify-catalog.sh C12 (Phase 2c-N3). Recomputes each canonical's
# sha256 against the pinned value here AND verifies every mirror equals the
# canonical's pinned value. Mismatch → exit 1 with deterministic diagnostic.
#
# Threat model (per hunt REC-7 — prompt-injection-as-supply-chain): an
# attacker editing a single mirror to inject "ignore previous instructions"
# into an expert prompt must ALSO update this lock manifest in the same PR
# to evade C12. Two-file coordinated edit is a strictly higher bar than a
# silent single-file write and is reviewable as code. C11 (B2 byte-identity
# check via cp-mirrors.py --check) is INDEPENDENT of this gate — tampering
# both files fools C12 but not C11 unless the canonical is ALSO edited.
#
# Lock semantics:
#   - canonical.path: relative to SKILLS root; matches REF_PATH_REGEX.
#   - canonical.sha256: hex digest at lock time; MUST equal current on-disk
#     hash. Updating canonical content REQUIRES bumping this value in same PR.
#   - mirrors[]: relative paths; each MUST sha256-match canonical at all times.
#
# Per-file <!-- canonical-source: ... --> HTML-comment markers at top of each
# quality-X.md (canonical AND mirrors) document the lineage in-band. Marker
# text is IDENTICAL across canonical and mirrors so byte-identity holds.

